onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[ui]
status_indicators = "symbols"

[keys]
prefix = "alt+space"
previous_workspace = ["prefix+k", "alt+k"]
next_workspace     = ["prefix+j", "alt+j"]
previous_tab       = ["prefix+h", "prefix+p", "alt+h"]
next_tab           = ["prefix+l", "prefix+n", "alt+l"]
previous_agent     = ["prefix+i", "alt+i"]
next_agent         = ["prefix+u", "alt+u"]
focus_pane_left    = ["alt+y"]
focus_pane_right   = ["prefix+o", "alt+o"]
new_tab            = ["prefix+t"]
new_workspace      = ["prefix+w"]
close_tab          = ["prefix+c"]
workspace_picker   = ["prefix+y"]

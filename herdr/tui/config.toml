onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[ui]
status_indicators = "symbols"

[keys]
prefix = "alt+space"
previous_workspace = ["prefix+k", "alt+k"]
next_workspace     = ["prefix+j", "alt+j"]
previous_tab       = ["prefix+h", "prefix+p", "alt+h"]
next_tab           = ["prefix+l", "prefix+n", "alt+l"]
previous_agent     = ["prefix+i", "alt+i"]
next_agent         = ["prefix+u", "alt+u"]
focus_pane_left    = ["prefix+y", "alt+n"]
focus_pane_down    = ["alt+m"]
focus_pane_up      = ["alt+comma"]
focus_pane_right   = ["prefix+o", "alt+period"]
# object = letter (t tab, w workspace, v pane), action = modifier (none new, shift rename, ctrl close)
new_tab            = ["prefix+t", "alt+t"]
rename_tab         = ["prefix+shift+t"]
close_tab          = ["prefix+ctrl+t"]
new_workspace      = ["prefix+w", "alt+w"]
rename_workspace   = ["prefix+shift+w"]
close_workspace    = ["prefix+ctrl+w"]
split_vertical     = ["prefix+v"]
rename_pane        = ["prefix+shift+v"]
close_pane         = ["prefix+ctrl+v"]
goto               = ["prefix+g", "alt+g"]
toggle_sidebar     = ["prefix+b", "alt+b"]
